# ───────────────────────────────────────────────────────
# Panorama Seaside Studios — Nginx Configuration
# Reverse proxy with full security headers & rate limiting
# ───────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ──────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ─── Security: Hide Nginx version ─────────────────
    server_tokens off;

    # ─── Gzip Compression ─────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ─── Rate Limiting ────────────────────────────────
    # General: 10 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # API: stricter 5 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    # Login: very strict 3 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

    # ─── Upstream ─────────────────────────────────────
    upstream nextjs {
        server app:3000;
        keepalive 32;
    }

    # ─── Block bad bots & scanners ────────────────────
    map $http_user_agent $bad_bot {
        default 0;
        ~*sqlmap 1;
        ~*nikto 1;
        ~*nmap 1;
        ~*masscan 1;
        ~*dirbuster 1;
        ~*havij 1;
    }

    # ═══════════════════════════════════════════════════
    # HTTP Server (port 80)
    # ═══════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # Block bad bots
        if ($bad_bot) {
            return 444;
        }

        # Block common attack patterns in URL
        location ~* "(\.\.\/|\.\.\\|%2e%2e|select.*from|insert.*into|delete.*from|drop.*table|update.*set|union.*select|script>|<script)" {
            return 444;
        }

        # ─── Security Headers ─────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS: uncomment when SSL is configured
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ─── Static assets (long cache) ───────────────
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─── API rate limiting ─────────────────────────
        location /api/auth {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ─── Stripe webhooks (no rate limit) ──────────
        location /api/webhooks/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ─── Everything else ──────────────────────────
        location / {
            limit_req zone=general burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ─── Block access to hidden files ─────────────
        location ~ /\. {
            deny all;
            return 404;
        }
    }

    # ═══════════════════════════════════════════════════
    # HTTPS Server (port 443) — UNCOMMENT WHEN DOMAIN IS READY
    # ═══════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #
    #     # ... same location blocks as port 80 ...
    # }
}
